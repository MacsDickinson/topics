name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'pages-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build site
        run: |
          rm -rf _site
          cp -R docs/site _site
          rm -f _site/check-links.py
          touch _site/.nojekyll
          sha="$(git rev-parse --short HEAD)"
          date="$(date -u +'%Y-%m-%d')"
          find _site -name '*.html' -exec sed -i "s/{{BUILD_SHA}}/${sha}/g; s/{{BUILD_DATE}}/${date}/g" {} +
          if grep -rq '{{BUILD_' _site --include='*.html'; then echo 'unreplaced build placeholder'; exit 1; fi

      - name: Validate relative links
        run: python3 docs/site/check-links.py _site

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: _site
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 7
          include-hidden-files: true

  publish-branch:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: _site
      - name: Publish generated files to gh-pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"

          cd _site
          git init --initial-branch=gh-pages
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          # An empty result is valid on the first publish. A failed lookup stops the job.
          branch="$(git ls-remote --heads origin refs/heads/gh-pages)"
          if [ -n "$branch" ]; then
            git fetch --depth=1 origin refs/heads/gh-pages
            git reset --soft FETCH_HEAD
          fi
          git add --all --force
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "Deploy docs from $GITHUB_SHA"
          fi
          git push origin HEAD:refs/heads/gh-pages

  deploy:
    needs: [build, publish-branch]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
