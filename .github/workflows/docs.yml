name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'pages-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build site
        run: |
          rm -rf _site
          cp -R docs/site _site
          rm -f _site/check-links.py
          touch _site/.nojekyll
          sha="$(git rev-parse --short HEAD)"
          date="$(date -u +'%Y-%m-%d')"
          find _site -name '*.html' -exec sed -i "s/{{BUILD_SHA}}/${sha}/g; s/{{BUILD_DATE}}/${date}/g" {} +
          if grep -rq '{{BUILD_' _site --include='*.html'; then echo 'unreplaced build placeholder'; exit 1; fi

      - name: Validate relative links
        run: python3 docs/site/check-links.py _site

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: _site
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: _site
      - name: Require DOCS_DEPLOY_TOKEN
        env:
          DOCS_DEPLOY_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DOCS_DEPLOY_TOKEN" ]; then
            echo "::error::Repository secret DOCS_DEPLOY_TOKEN is missing. Pushes made with GITHUB_TOKEN do not trigger a branch Pages build, so the live site would go stale. See docs/site/README.md#deployment."
            exit 1
          fi
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Required (checked above): a fine-grained PAT with Contents: write on this repository only.
          # GITHUB_TOKEN pushes don't trigger the branch Pages build.
          github_token: ${{ secrets.DOCS_DEPLOY_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Deploy docs from ${{ github.sha }}"
