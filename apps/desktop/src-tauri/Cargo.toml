[package]
name = "topics-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-dialog = "=2.8.4"
tauri = { version = "2", features = [] }
serde = { version = "1" }
serde_json = "1"
topics-core = { path = "../../../crates/topics-core" }
topics-setup = { path = "../../../crates/topics-setup" }
topics-runtime = { path = "../../../crates/topics-runtime" }
topics-store = { path = "../../../crates/topics-store" }

[features]
default = []
native-test = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies.tauri-plugin-wdio]
version = "1"
optional = true

[dependencies.tauri-plugin-wdio-webdriver]
version = "1"
optional = true

[dev-dependencies]
tempfile = "3"
