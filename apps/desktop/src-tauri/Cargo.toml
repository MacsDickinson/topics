[package]
name = "topics-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
topics-store = { path = "../../../crates/topics-store" }

[features]
default = []
native-test = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies.tauri-plugin-wdio]
version = "1"
optional = true

[dependencies.tauri-plugin-wdio-webdriver]
version = "1"
optional = true
