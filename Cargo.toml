[workspace]
members = ["crates/topics-core", "crates/topics-store", "crates/topics-cli", "crates/topics-bdd", "crates/topics-runtime", "crates/topics-setup", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
topics-core = { path = "crates/topics-core" }
topics-store = { path = "crates/topics-store" }
topics-runtime = { path = "crates/topics-runtime" }
topics-setup = { path = "crates/topics-setup" }
